<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f14">
  <title>AKSUMAEL</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f14;
      --surface: #13161f;
      --surface2: #1a1e2e;
      --border: #252a3a;
      --text: #dde1f0;
      --text-dim: #606880;
      --accent: #7c6bff;
      --accent2: #3b82f6;
      --user-bg: #162840;
      --user-text: #c4daf5;
      --bot-bg: #161a28;
      --bot-border: #252a3a;
      --send: #7c6bff;
      --send-h: #9b8dff;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.6;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .hdr-avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c6bff 0%, #3b82f6 100%);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 14px; color: #fff;
      flex-shrink: 0;
      box-shadow: 0 0 0 2px #1a1e2e, 0 0 0 3px #7c6bff44;
    }

    .hdr-name { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
    .hdr-sub  { font-size: 11px; color: var(--text-dim); margin-top: 1px; }

    .hdr-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

    .clear-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      transition: border-color .2s, color .2s;
    }
    .clear-btn:hover { border-color: var(--accent); color: var(--text); }

    .status-pill {
      display: flex; align-items: center; gap: 5px;
      font-size: 11px; color: #4ade80;
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
      animation: pulse 2.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; } 50% { opacity: .5; }
    }

    /* ── Messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Welcome */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      gap: 10px;
    }
    .welcome-logo {
      font-size: 32px; font-weight: 800; letter-spacing: 0.08em;
      background: linear-gradient(135deg, #7c6bff, #3b82f6);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .welcome-tagline { font-size: 13px; color: var(--text-dim); max-width: 260px; }
    .welcome-hint {
      margin-top: 18px;
      font-size: 12px;
      color: var(--text-dim);
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 10px 16px;
    }

    /* Message rows */
    .row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 88%;
    }
    .row.user { align-self: flex-end; flex-direction: row-reverse; }
    .row.bot  { align-self: flex-start; }

    .row-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c6bff, #3b82f6);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 10px; color: #fff;
      flex-shrink: 0; margin-bottom: 2px;
    }

    .bwrap { display: flex; flex-direction: column; gap: 3px; }
    .row.user .bwrap { align-items: flex-end; }

    .bname {
      font-size: 11px; color: var(--text-dim);
      padding: 0 5px;
    }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      max-width: 100%;
      word-wrap: break-word;
      white-space: pre-wrap;
      line-height: 1.58;
      font-size: 14.5px;
    }
    .row.bot .bubble {
      background: var(--bot-bg);
      color: var(--text);
      border: 1px solid var(--bot-border);
      border-radius: 4px 16px 16px 16px;
    }
    .row.user .bubble {
      background: var(--user-bg);
      color: var(--user-text);
      border-radius: 16px 4px 16px 16px;
    }

    /* Typing indicator */
    .typing-bubble {
      display: flex; align-items: center; gap: 5px;
      padding: 13px 16px;
      background: var(--bot-bg);
      border: 1px solid var(--bot-border);
      border-radius: 4px 16px 16px 16px;
    }
    .tdot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-dim);
      animation: tdot 1.3s ease-in-out infinite;
    }
    .tdot:nth-child(2) { animation-delay: .18s; }
    .tdot:nth-child(3) { animation-delay: .36s; }
    @keyframes tdot {
      0%,60%,100% { transform: translateY(0); opacity: .35; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* ── Input bar ── */
    #bar {
      flex-shrink: 0;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    #inp {
      flex: 1;
      resize: none;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--surface2);
      color: var(--text);
      font: inherit;
      font-size: 15px;
      padding: 10px 16px;
      outline: none;
      min-height: 44px;
      max-height: 140px;
      line-height: 1.45;
      transition: border-color .2s;
      overflow-y: auto;
    }
    #inp:focus { border-color: var(--accent); }
    #inp::placeholder { color: var(--text-dim); }

    #send {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--send);
      border: none; color: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      transition: background .2s, transform .1s, opacity .2s;
    }
    #send:hover  { background: var(--send-h); }
    #send:active { transform: scale(.9); }
    #send:disabled { opacity: .35; cursor: not-allowed; transform: none; }
    #send svg { width: 18px; height: 18px; }

    @media (min-width: 600px) {
      #messages { padding: 28px 24px; }
      .row { max-width: 72%; }
    }
  </style>
</head>
<body>

<header>
  <div class="hdr-avatar">A</div>
  <div>
    <div class="hdr-name">AKSUMAEL</div>
    <div class="hdr-sub">Engineering intelligence · robocar-hub</div>
  </div>
  <div class="hdr-right">
    <button class="clear-btn" id="clearBtn">Clear</button>
    <div class="status-pill">
      <div class="status-dot"></div>
      <span>online</span>
    </div>
  </div>
</header>

<div id="messages">
  <div class="welcome" id="welcome">
    <div class="welcome-logo">AKSUMAEL</div>
    <div class="welcome-tagline">ak-SOO-male · engineering AI for the Aksümal platform</div>
    <div class="welcome-hint">Ask me anything — hardware, software, robotics, or what I am thinking.</div>
  </div>
</div>

<div id="bar">
  <textarea id="inp" placeholder="Message AKSUMAEL..." rows="1"></textarea>
  <button id="send" title="Send (Enter)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"></line>
      <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
    </svg>
  </button>
</div>

<script>
(function () {
  var msgs   = document.getElementById("messages");
  var inp    = document.getElementById("inp");
  var sendEl = document.getElementById("send");
  var clearEl = document.getElementById("clearBtn");
  var welcome = document.getElementById("welcome");
  var busy   = false;

  function scrollDown() {
    msgs.scrollTop = msgs.scrollHeight;
  }

  function addRow(role, text) {
    if (welcome) { welcome.remove(); welcome = null; }

    var row  = document.createElement("div");
    row.className = "row " + role;

    if (role === "bot") {
      var av = document.createElement("div");
      av.className = "row-avatar";
      av.textContent = "A";
      row.appendChild(av);
    }

    var bwrap = document.createElement("div");
    bwrap.className = "bwrap";

    var bname = document.createElement("div");
    bname.className = "bname";
    bname.textContent = role === "bot" ? "AKSUMAEL" : "You";
    bwrap.appendChild(bname);

    var bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    bwrap.appendChild(bubble);

    row.appendChild(bwrap);
    msgs.appendChild(row);
    scrollDown();
    return bubble;
  }

  var typingRow = null;

  function showTyping() {
    if (welcome) { welcome.remove(); welcome = null; }
    typingRow = document.createElement("div");
    typingRow.className = "row bot";

    var av = document.createElement("div");
    av.className = "row-avatar";
    av.textContent = "A";
    typingRow.appendChild(av);

    var bwrap = document.createElement("div");
    bwrap.className = "bwrap";

    var bname = document.createElement("div");
    bname.className = "bname";
    bname.textContent = "AKSUMAEL";
    bwrap.appendChild(bname);

    var ti = document.createElement("div");
    ti.className = "typing-bubble";
    for (var i = 0; i < 3; i++) {
      var d = document.createElement("div");
      d.className = "tdot";
      ti.appendChild(d);
    }
    bwrap.appendChild(ti);
    typingRow.appendChild(bwrap);
    msgs.appendChild(typingRow);
    scrollDown();
  }

  function removeTyping() {
    if (typingRow) { typingRow.remove(); typingRow = null; }
  }

  async function send() {
    var text = inp.value.trim();
    if (!text || busy) return;

    busy = true;
    sendEl.disabled = true;
    inp.value = "";
    inp.style.height = "";

    addRow("user", text);
    showTyping();

    try {
      var res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });
      var data = await res.json();
      removeTyping();
      addRow("bot", data.response || data.error || "(no response)");
    } catch (err) {
      removeTyping();
      addRow("bot", "(Network error: " + err.message + ")");
    }

    busy = false;
    sendEl.disabled = false;
    inp.focus();
  }

  async function clearChat() {
    try { await fetch("/reset", { method: "POST" }); } catch(e) {}
    msgs.innerHTML = "";
    var w = document.createElement("div");
    w.className = "welcome";
    w.id = "welcome";
    w.innerHTML = '<div class="welcome-logo">AKSUMAEL</div>'
      + '<div class="welcome-tagline">ak-SOO-male · engineering AI for the Aksumal platform</div>'
      + '<div class="welcome-hint">Ask me anything — hardware, software, robotics, or what I am thinking.</div>';
    msgs.appendChild(w);
    welcome = w;
  }

  inp.addEventListener("input", function () {
    this.style.height = "";
    this.style.height = Math.min(this.scrollHeight, 140) + "px";
  });

  inp.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  sendEl.addEventListener("click", send);
  clearEl.addEventListener("click", clearChat);

  inp.focus();
})();
</script>
</body>
</html>
